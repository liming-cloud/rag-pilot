# 依赖与漏洞提醒：只开 PR 提醒，不自动合并。新增依赖仍按 DECISIONS.md 记录；Spring Boot、Spring AI 等大版本升级单独评估。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
