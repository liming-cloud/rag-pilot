name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # 运行全部单元测试、Modulith 边界测试和 Testcontainers 集成测试（运行器自带 Docker）。
      - name: 构建并测试
        run: ./mvnw -B -ntp verify
      # 把测试数量写成检查注释，PR 页面直接可见；测试数为 0 时判为失败，防止测试被静默跳过。
      - name: 汇总测试结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for path in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              print(f"{root.get('name')}: {root.get('tests')} 个")
              # 失败用例写成错误注释（含异常摘要），不用翻日志就能定位。
              for case in root.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = problem.text or ""
                      causes = [line.strip() for line in text.splitlines() if line.strip().startswith("Caused by:")]
                      head = (problem.get("message") or "").strip().replace("\n", " ")[:300]
                      root_cause = causes[-1][:500] if causes else ""
                      detail = f"{head} ｜ 根因：{root_cause}" if root_cause else head
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          print(f"::notice title=测试结果::共 {total} 个测试，失败 {failed}，跳过 {skipped}")
          sys.exit(1 if total == 0 else 0)
          PY

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t rag-app:ci .
      - name: 校验 Compose 配置
        run: DB_PASSWORD=ci MODEL_API_KEY=ci docker compose -f deploy/compose.yml config --quiet

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # Node 24 自带 npm 11；npm 10 解析 rolldown 的 WebAssembly 依赖时有已知崩溃（见 DECISIONS.md D-012）。
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build
