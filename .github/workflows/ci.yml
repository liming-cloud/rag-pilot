name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # 运行全部单元测试、Modulith 边界测试和 Testcontainers 集成测试（运行器自带 Docker）。
      - name: 构建并测试
        run: ./mvnw -B -ntp verify
      # 把测试数量写成检查注释，PR 页面直接可见；测试数为 0 时判为失败，防止测试被静默跳过。
      - name: 汇总测试结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for path in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              print(f"{root.get('name')}: {root.get('tests')} 个")
              # 失败用例写成错误注释（含异常摘要），不用翻日志就能定位。
              for case in root.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = problem.text or ""
                      causes = [line.strip() for line in text.splitlines() if line.strip().startswith("Caused by:")]
                      head = (problem.get("message") or "").strip().replace("\n", " ")[:300]
                      root_cause = causes[-1][:500] if causes else ""
                      detail = f"{head} ｜ 根因：{root_cause}" if root_cause else head
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{detail}")
          print(f"::notice title=测试结果::共 {total} 个测试，失败 {failed}，跳过 {skipped}")
          sys.exit(1 if total == 0 else 0)
          PY
      # 失败时保存测试报告（含完整堆栈），保留 7 天。
      - name: 保存测试报告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 与客户现场相同（#138）：打发布包，在解压后的目录里用 Compose 从 jar、dist 构建镜像。
      - name: 打发布包
        run: deploy/package.sh 0.0.0.0 packages && tar -xzf packages/rag-pilot-0.0.0.0.tar.gz
      - name: 校验 Compose 配置并构建镜像
        working-directory: rag-pilot-0.0.0.0
        env:
          DB_PASSWORD: ci
          MODEL_API_KEY: ci
          REDIS_PASSWORD: ci
        run: |
          docker compose -f compose.yml --env-file release.env config --quiet
          docker compose -f compose.yml --env-file release.env build app web
      - name: 校验 Nginx 配置
        # app 主机名只在 Compose 网络里能解析，这里临时指向本机。
        run: docker run --rm --add-host app:127.0.0.1 rag-pilot-web:0.0.0.0 nginx -t

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 自带 npm 11；npm 10 解析 rolldown 的 WebAssembly 依赖时有已知崩溃（见 D-012）。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 静态检查
        run: npm run lint
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build

  # PR 标题前缀只用 feat/fix/build/docs，PR 内不含 wip 提交；脚本与 domain-forge 一致（D-066）。
  guard:
    name: guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 检查标题前缀与 WIP 提交
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check_pr_guard.sh "$PR_TITLE" "$BASE_SHA" "$HEAD_SHA"
