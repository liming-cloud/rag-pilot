name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # 运行全部单元测试、Modulith 边界测试和 Testcontainers 集成测试（运行器自带 Docker）。
      - name: 构建并测试
        run: ./mvnw -B -ntp verify

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t rag-app:ci .
      - name: 校验 Compose 配置
        run: DB_PASSWORD=ci docker compose -f deploy/compose.yml config --quiet
