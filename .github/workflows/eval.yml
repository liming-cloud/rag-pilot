name: eval

# 用真实模型跑评测集，结果写在运行摘要里。会产生少量模型调用费用（每次约 32 题），
# 所以只在改动检索、问答、模型适配或评测集时运行，也可以在 Actions 页面手动运行。
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 连续跑几轮（看指标波动；每轮约 47 题的模型费用）
        default: "1"
      min_relevance:
        description: 拒答门槛（重排相关度）
        default: "0.2"
      rewrite_min_relevance:
        description: 低分改写下限，不填用 application.yml 的默认值
        default: ""
      chat_model:
        description: 回答模型（也用于低分改写），不填用 application.yml 的默认值
        default: ""
      rerank_model:
        description: 重排模型，不填用 application.yml 的默认值
        default: ""
      candidates:
        description: 送去重排的检索候选数，不填用 application.yml 的默认值
        default: ""
      evidence_limit:
        description: 送进提示词的最多证据条数，不填用 application.yml 的默认值
        default: ""
      hedge_after:
        description: 流式回答多久没出首字就发备用请求（如 2s），填 off 不发，不填用 application.yml 的默认值
        default: ""
      hedge_model:
        description: 备用请求用的模型，填 same 与回答模型相同，不填用 application.yml 的默认值
        default: ""
  pull_request:
    paths:
      - backend/rag-ai/**
      - backend/rag-knowledge/**
      - backend/rag-answering/**
      - backend/rag-evaluation/**
      - backend/rag-app/src/test/resources/eval/**
      - backend/rag-app/src/main/resources/application.yml
      - .github/workflows/eval.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: 检查密钥
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "::error title=缺少密钥::请在仓库 Settings → Secrets and variables → Actions 添加 MODEL_API_KEY"
            exit 1
          fi
      - name: 运行评测
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EVAL_ROUNDS: ${{ inputs.rounds || '1' }}
          EVAL_MIN_RELEVANCE: ${{ inputs.min_relevance || '0.2' }}
          REWRITE_MIN_RELEVANCE: ${{ inputs.rewrite_min_relevance }}
          CHAT_MODEL: ${{ inputs.chat_model || 'deepseek-ai/DeepSeek-V3' }}
          RERANK: ${{ inputs.rerank_model }}
          CANDIDATES: ${{ inputs.candidates }}
          EVIDENCE_LIMIT: ${{ inputs.evidence_limit }}
          HEDGE_AFTER: ${{ inputs.hedge_after }}
          HEDGE_MODEL: ${{ inputs.hedge_model }}
        # 空环境变量会覆盖 application.yml 的默认值，所以只在填了输入时才设置。
        run: |
          if [ -n "$RERANK" ]; then export RERANK_MODEL="$RERANK"; fi
          if [ -n "$REWRITE_MIN_RELEVANCE" ]; then export RAG_REWRITE_MIN_RELEVANCE="$REWRITE_MIN_RELEVANCE"; fi
          if [ -n "$CANDIDATES" ]; then export RAG_ANSWERING_CANDIDATES="$CANDIDATES"; fi
          if [ -n "$EVIDENCE_LIMIT" ]; then export RAG_ANSWERING_EVIDENCE_LIMIT="$EVIDENCE_LIMIT"; fi
          if [ "$HEDGE_AFTER" = off ]; then export CHAT_HEDGE_AFTER=; elif [ -n "$HEDGE_AFTER" ]; then export CHAT_HEDGE_AFTER="$HEDGE_AFTER"; fi
          if [ "$HEDGE_MODEL" = same ]; then export CHAT_HEDGE_MODEL=; elif [ -n "$HEDGE_MODEL" ]; then export CHAT_HEDGE_MODEL="$HEDGE_MODEL"; fi
          ./mvnw -B -ntp verify -pl backend/rag-app -am \
            -Dtest.groups=eval -Dtest.excludedGroups=none \
            -Dtest=EvaluationRun -Dsurefire.failIfNoSpecifiedTests=false
      - name: 保存报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/rag-app/target/eval-report.md
          if-no-files-found: ignore
