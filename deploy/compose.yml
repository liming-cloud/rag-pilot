# 试点部署：db + app。docling-serve 和 web（Nginx）在后续 PR 中加入。
# 用法：cp deploy/.env.example deploy/.env，设置密码后执行
#   docker compose -f deploy/compose.yml --env-file deploy/.env up --build
name: rag-pilot

services:
  db:
    # ParadeDB（PostgreSQL 18，按摘要锁定）：同时提供 pgvector 向量检索与 pg_search BM25（jieba 中文分词），见 DECISIONS.md D-007。
    image: paradedb/paradedb@sha256:9b15fc383bcd771f1e32e222bd1603c4c29856c481f6bd06f1960e89608c02f0
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 中设置 DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/rag
      DB_USERNAME: rag
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
