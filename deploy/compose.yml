# 试点部署：db + app。docling-serve 和 web（Nginx）在后续 PR 中加入。
# 用法：cp deploy/.env.example deploy/.env，设置密码后执行
#   docker compose -f deploy/compose.yml --env-file deploy/.env up --build
name: rag-pilot

services:
  db:
    # 旧项目已验证的 pgvector 镜像，按摘要锁定；ParadeDB 中文 BM25 验证通过后再切换（见 DECISIONS.md D-007）。
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 中设置 DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/rag
      DB_USERNAME: rag
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
