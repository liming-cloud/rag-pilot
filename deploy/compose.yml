# 部署：db + app + web（Nginx 提供前端并转发 /api，见 DECISIONS.md D-029）。员工访问 web 的端口。
# 在发布包解压后的目录里使用（#138）：包里有编译好的 app/rag-app.jar 和 web/dist，app、web 镜像由 build.sh 在宿主机上构建，
# 安装、升级、备份恢复见 README.md：
#   docker compose -f compose.yml --env-file .env --env-file release.env up -d
# 开发时先用仓库里的 deploy/package.sh 打一个本地发布包，再在解压后的目录里安装（见根目录 README.md）。
name: rag-pilot

# 容器日志按大小轮转，避免占满磁盘。
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    # ParadeDB（PostgreSQL 18）：同时提供 pgvector 向量检索与 pg_search BM25（jieba 中文分词），见 DECISIONS.md D-007。
    # 按摘要锁定，从镜像仓库拉（#138）；用镜像源或内网仓库时在 .env 里设 RAG_DB_IMAGE，摘要保持不变。
    image: ${RAG_DB_IMAGE:-paradedb/paradedb@sha256:9b15fc383bcd771f1e32e222bd1603c4c29856c481f6bd06f1960e89608c02f0}
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # 走 TCP：初始化用的临时实例只监听本地套接字，不能算就绪。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  app:
    image: rag-pilot-app:${RAG_VERSION:-dev}
    # 在宿主机上用发布包里的 jar 构建（build.sh）。JRE 基础镜像按摘要锁定；用镜像源或内网仓库时在 .env 里设 RAG_JRE_IMAGE。
    build:
      context: .
      dockerfile: app.Dockerfile
      args:
        RAG_VERSION: ${RAG_VERSION:-dev}
        JRE_IMAGE: ${RAG_JRE_IMAGE:-eclipse-temurin:25-jre@sha256:ecdc0adb37bde1a281c4d245a3cd535004b1fc8322d560f5b09463b248c81df0}
    environment:
      DB_URL: jdbc:postgresql://db:5432/rag
      DB_USERNAME: rag
      DB_PASSWORD: ${DB_PASSWORD}
      RAG_STORAGE_ROOT: /data/files
      MODEL_API_KEY: ${MODEL_API_KEY:?请在 .env 中设置 MODEL_API_KEY}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.siliconflow.cn/v1}
      # 本地确定性模型（hashing / lexical / extractive）只用于离线试用和部署验证（verify.sh），不能用于正式使用。
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-openai}
      RAG_CHAT_PROVIDER: ${RAG_CHAT_PROVIDER:-openai}
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-admin}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-}
      RAG_ADMIN_RESET_PASSWORD: ${RAG_ADMIN_RESET_PASSWORD:-}
      RAG_BRAND_NAME: ${RAG_BRAND_NAME:-}
      RAG_BRAND_TAGLINE: ${RAG_BRAND_TAGLINE:-}
      RAG_BRAND_LOGIN_HINT: ${RAG_BRAND_LOGIN_HINT:-}
      RAG_MASTER_KEY: ${RAG_MASTER_KEY:-}
      RAG_INDUSTRY_PACK: ${RAG_INDUSTRY_PACK:-retail}
      RAG_STATS_ZONE: ${RAG_STATS_ZONE:-Asia/Shanghai}
      RAG_EXPIRY_WARNING_DAYS: ${RAG_EXPIRY_WARNING_DAYS:-30}
    volumes:
      - app-files:/data/files
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 只绑定本机，用于运维检查健康状态和版本；员工经 web 访问接口。
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped
    # 停服务时先等进行中的请求（最多 30 秒），再等后台正在生成的回答（最多 30 秒，见 application.yml 的
    # spring.task.execution.shutdown），之后才强制结束；Docker 默认只等 10 秒（#135）。
    stop_grace_period: 75s
    logging: *logging

  web:
    image: rag-pilot-web:${RAG_VERSION:-dev}
    # 在宿主机上用发布包里的 dist 构建（build.sh）。Nginx 基础镜像按摘要锁定；用镜像源或内网仓库时在 .env 里设 RAG_NGINX_IMAGE。
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        NGINX_IMAGE: ${RAG_NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    # 不依赖 app 启动：备份、升级时 app 停了，页面照常打开，接口返回“系统维护中”。
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  app-files:
