# 前端静态文件 + /api 反向代理到 app。app 不对外暴露，员工只访问这里。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 与后端 spring.servlet.multipart.max-request-size（55MB）一致，单文件上限 50MB 由后端校验并给出提示。
    client_max_body_size 55m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式问答（SSE）逐字转发，不缓冲；后端单次流式最长 2 分钟。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }

    # 构建产物文件名带哈希，可以长期缓存；字体分片也在这里。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端路由（/knowledge、/answers 等）刷新时回到 index.html；index.html 本身不缓存，发版后立即生效。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
