# 前端静态文件 + /api 反向代理到 app。app 不对外暴露，员工只访问这里。

# 登录限流（#145 B5）：同一来源 IP 每分钟最多 10 次登录、可突发 5 次，超出返回 429。只对 /api/auth/login 生效：
# 键为空的请求不限流。账号本身连续输错 5 次还会锁定（D-038），这里挡的是换着账号试。
map $request_uri $login_client {
    ~^/api/auth/login  $binary_remote_addr;
    default            "";
}
limit_req_zone $login_client zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 与后端 spring.servlet.multipart.max-request-size（55MB）一致，单文件上限 50MB 由后端校验并给出提示。
    client_max_body_size 55m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 每次请求经 Docker 内置 DNS 解析 app：app 重启后地址可能变，app 没启动时 Nginx 也能先起来（D-048）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $app http://app:8080;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式问答（SSE）逐字转发，不缓冲；后端单次流式最长 2 分钟。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
        # 备份、升级时 app 停了：返回问题详情，页面直接显示“系统维护中”。
        proxy_intercept_errors off;
        error_page 502 503 504 = @maintenance;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;
    }

    location @too_many_logins {
        default_type application/problem+json;
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","detail":"登录尝试太频繁，请稍后再试"}';
    }

    location @maintenance {
        default_type application/problem+json;
        return 503 '{"status":503,"code":"MAINTENANCE","detail":"系统维护中，请稍后再试"}';
    }

    # 构建产物文件名带哈希，可以长期缓存；字体分片也在这里。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 前端路由（/knowledge、/answers 等）刷新时回到 index.html；index.html 本身不缓存，发版后立即生效。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
