# 安全响应头（#145 C3）。Nginx 的 location 里一旦有自己的 add_header，就不再继承 server 级的，所以在 server 级和每个带
# add_header 的 location 里都 include 这个文件。
# - CSP：脚本只能来自本站（登录令牌在 localStorage，挡住注入的脚本最要紧）；样式允许内联，因为对话框锁定滚动时
#   运行时会插入 <style>（Radix）；字体是 CSS 里的 data: URI；只连本站接口；不允许被嵌进别的页面。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
