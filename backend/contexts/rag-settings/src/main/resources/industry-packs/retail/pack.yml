# 新零售行业包（D-045），默认行业包。内核代码里不写行业内容，提示词角色、话术、文案、推荐问题、行业词表都在这里。
# 问答页文案、推荐问题、拒答话术是默认值，管理员可以在“系统设置”里改；提示词和词表直接影响检索和回答质量，
# 只在这里改，改完要跑评测。文字与配置化之前逐字一致，评测才可比。
name: 新零售

answer:
  role: 你是连锁门店的运营助手，回答门店员工的问题。
  # 回答提示词里说明引用格式时用的示例句，要以 [数字] 结尾。
  citation-example: 临期商品提前三天下架[2]。
  refusal: 知识库里没有找到能回答这个问题的可靠依据，建议换个问法，或联系店长确认。

rewrite:
  role: 你负责把连锁门店员工的提问改写成便于检索门店制度文件的规范问题。
  hints:
    - 提到具体商品时，在后面补上它所属的商品类别。

chat:
  placeholder: 问问门店规范、商品、促销…
  empty-hint: 问问门店规范、商品、促销，回答会标出原文出处，可以接着追问。
  suggested-questions:
    - 临期商品怎么处理？
    - 鲜食晚上几点下架？
    - 收银长短款怎么处理？
    - 促销价签多久检查一次？

# 行业标志词：内核代码（Java 主代码、前端非测试代码）里不能出现，由 KernelNeutralityTest 和前端 structure.test.ts
# 检查；词表里的词同样不能出现。不参与检索。
markers: [门店, 店长, 店员, 零售, 便利店, 鲜食, 商品, 促销, 收银, 陈列, 临期]

# 行业词表：问题里出现 members 里的词、又没提到 term 时，检索前把 term 加进检索用的问题；给模型看的仍是原问题。
# 只放确实属于某个类别的说法，宽泛的词（如“活动”）会让很多问题都多出检索词，影响检索。
vocabulary:
  - term: 鲜食
    members: [便当, 饭团, 三明治, 寿司, 关东煮, 凉面]
  - term: 日配
    members: [牛奶, 鲜奶, 酸奶, 面包]
  - term: 冻品
    members: [冰淇淋, 雪糕, 速冻水饺]
  - term: 临期商品
    members: [临期品, 快过期, 快到期]
  - term: 报损
    members: [报废, 坏货]
  - term: 收银差异
    members: [长短款]
  - term: 价签
    members: [标价签, 价格牌, 价格标签]
  - term: 交接班
    members: [交班, 接班]
  - term: 陈列
    members: [摆货, 排面]
  - term: 促销
    members: [打折, 特价, 满减]
