spring:
  application:
    name: rag-pilot
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # 与 DocumentIngestionService.MAX_SIZE_BYTES 一致。
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USERNAME:rag}
    password: ${DB_PASSWORD:}
  flyway:
    # 每个模块一个迁移目录；版本号统一用时间戳，避免目录之间版本冲突。
    locations:
      - classpath:db/migration/identity
      - classpath:db/migration/knowledge
      - classpath:db/migration/answering
      - classpath:db/migration/evaluation

mybatis-plus:
  # SQL 只写在各模块的 mapper/<模块名>/*.xml 里，不用注解（AGENTS.md“约束”）。
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false

# 试点为单实例部署，会话存在内存里，应用重启后需要重新登录；多实例时改用 Redis 存储。
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 28800
  active-timeout: 1800
  is-read-cookie: false
  is-read-header: true
  is-print: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

rag:
  ai:
    # 嵌入、重排、对话默认共用一个 OpenAI 兼容地址和密钥（硅基流动），见 DECISIONS.md。
    base-url: ${MODEL_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${MODEL_API_KEY:}
    timeout: 30s
    # provider 为 openai 时调用真实模型；hashing / lexical / extractive 是本地确定性实现，
    # 只用于测试和没有密钥时的离线开发，不能用于评测。
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:openai}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      batch-size: 16
    rerank:
      provider: ${RAG_RERANK_PROVIDER:openai}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    chat:
      provider: ${RAG_CHAT_PROVIDER:openai}
      model: ${CHAT_MODEL:deepseek-ai/DeepSeek-V3}
      temperature: 0.1
      max-tokens: 1024
      # 流式回答过了这么久还没出首字，就再发一个备用请求，用先出字的那个（见 DECISIONS.md D-028）。
      # 默认不发；评测里 2s 能消除服务卡住时的 503，但正常时段首字不变快。
      hedge-after: ${CHAT_HEDGE_AFTER:}
      # 备用请求用的模型：同一服务商的同一个模型常常整体卡住，换一个模型才躲得开；设为空时与 model 相同。
      hedge-model: ${CHAT_HEDGE_MODEL:deepseek-ai/DeepSeek-V4.1-Flash}
      # 轻量任务（会话标题）用的模型，用硅基流动的免费模型，不占回答的首字时间（D-036）；设为空时与 model 相同。
      light-model: ${CHAT_LIGHT_MODEL:Qwen/Qwen2.5-7B-Instruct}
  answering:
    # 检索候选数、送进提示词的证据数、重排相关度门槛（占位值，用评测集校准）。
    candidates: 30
    evidence-limit: 8
    min-relevance: 0.2
    # 重排最高分低于门槛时，先把问题改写成规范说法再检索一次，减少口语、错别字导致的误拒；只影响本来要拒答的问题。
    rewrite-on-low-relevance: ${RAG_REWRITE_ON_LOW_RELEVANCE:true}
    # 改写前最高分低于这个下限时，改写也救不回，直接拒答（按评测数据定的初值，待用开源数据集校准）。
    rewrite-min-relevance: ${RAG_REWRITE_MIN_RELEVANCE:0.03}
    # 改写超过这个时限就放弃，按原方式拒答。
    rewrite-timeout: ${RAG_REWRITE_TIMEOUT:3s}
  # 各模块的配置由对应的 @ConfigurationProperties record 读取并校验（AnsweringProperties、IdentityProperties、
  # KnowledgeProperties、AiProperties），取值说明见这些类。
  identity:
    # 账号表为空时用它创建超级管理员（全系统只有一个）；已有账号时不生效。
    admin:
      # 试点单租户：初始管理员建在这个租户下，之后的账号跟随创建它的管理员；请求的租户从登录会话取。
      tenant-id: 1
      username: ${RAG_ADMIN_USERNAME:}
      password: ${RAG_ADMIN_PASSWORD:}
      # 超级管理员密码丢失时由运维设置，启动时重置为它并解锁；重置后删掉这个变量再重启（D-038）。
      reset-password: ${RAG_ADMIN_RESET_PASSWORD:}
    # 登录页、顶栏显示的产品名称和提示（D-042）；留空时用内核默认值，见 IdentityProperties.Branding。
    branding:
      name: ${RAG_BRAND_NAME:}
      tagline: ${RAG_BRAND_TAGLINE:}
      login-hint: ${RAG_BRAND_LOGIN_HINT:}
  knowledge:
    ingestion:
      # 后台同时处理的文档数，限制对嵌入模型的并发调用。
      concurrency: ${RAG_INGESTION_CONCURRENCY:2}
    storage:
      # 原始文件存放目录；Compose 中挂载为数据卷。
      root: ${RAG_STORAGE_ROOT:./data/files}
