# 测试专用覆盖：全部用本地确定性模型，测试不访问外部模型服务。
rag:
  ai:
    embedding:
      provider: hashing
    rerank:
      provider: lexical
    chat:
      provider: extractive
  answering:
    min-relevance: 0.3
    # 集成测试共用一个应用上下文、用同一个管理员连续提问，放宽频率上限；限流本身在 AskRateLimitTests 里测（#145）。
    limits:
      per-minute: 1000
      per-day: 100000
  # 测试专用的初始管理员，与 TestLogin 一致；真实部署从环境变量读取。
  identity:
    admin:
      username: admin
      password: admin-test-password
